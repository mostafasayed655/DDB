<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DDB Client</title>
    <style>
        :root {
            --bg: #0f1b2d;
            --panel: #16263d;
            --accent: #2fd2a4;
            --muted: #8fa6c0;
            --text: #f3f6fb;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Segoe UI", sans-serif;
            background: radial-gradient(circle at top, #1a2a45, #0b1422);
            color: var(--text);
        }

        .app {
            max-width: 980px;
            margin: 32px auto;
            padding: 24px;
        }

        h1 {
            margin: 0 0 8px 0;
            font-size: 28px;
            letter-spacing: 0.5px;
        }

        .subtitle {
            margin-bottom: 20px;
            color: var(--muted);
        }

        .card {
            background: var(--panel);
            padding: 18px;
            border-radius: 12px;
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.25);
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 12px;
            color: var(--muted);
            margin-bottom: 6px;
        }

        input,
        select,
        textarea,
        button {
            width: 100%;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid #2a3a55;
            background: #0f1b2d;
            color: var(--text);
            font-size: 14px;
        }

        textarea {
            min-height: 180px;
            font-family: "Consolas", monospace;
            resize: vertical;
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .row-3 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
        }

        .actions {
            display: flex;
            gap: 12px;
        }

        button {
            background: var(--accent);
            color: #0b1422;
            border: none;
            font-weight: 600;
            cursor: pointer;
        }

        button.secondary {
            background: transparent;
            border: 1px solid var(--accent);
            color: var(--accent);
        }

        .response {
            white-space: pre-wrap;
            background: #0b1422;
            border-radius: 8px;
            padding: 12px;
            min-height: 120px;
            color: #e7f6ff;
            font-family: "Consolas", monospace;
        }

        .hint {
            font-size: 12px;
            color: var(--muted);
        }
    </style>
</head>

<body>
    <div class="app">
        <h1>DDB Client</h1>
        <div class="subtitle">Send requests to the master node.</div>

        <div class="card">
            <div class="row">
                <div>
                    <label>Master URL</label>
                    <input id="masterUrl" type="text" readonly />
                </div>
                <div>
                    <label>Operation</label>
                    <select id="operation"></select>
                </div>
            </div>
            <div class="row" style="margin-top: 12px;">
                <div>
                    <label>Method</label>
                    <input id="method" type="text" />
                </div>
                <div>
                    <label>Path</label>
                    <input id="path" type="text" />
                </div>
            </div>
            <div style="margin-top: 12px;">
                <label>Body (JSON)</label>
                <textarea id="body"></textarea>
                <div class="hint">Tip: use valid JSON. For GET, body can be empty.</div>
            </div>
            <div class="actions" style="margin-top: 12px;">
                <button id="load">Load template</button>
                <button id="send" class="secondary">Send</button>
            </div>
        </div>

        <div class="card">
            <label>Response</label>
            <div id="response" class="response"></div>
        </div>
    </div>

    <script>
        const templates = {
            "Create table": {
                method: "POST",
                path: "/table/create",
                body: {
                    table: "users",
                    columns: [
                        { name: "id", type: "INT" },
                        { name: "name", type: "VARCHAR(100)" }
                    ],
                    primaryKey: "id"
                }
            },
            "Insert": {
                method: "POST",
                path: "/insert",
                body: { table: "users", values: { id: 1, name: "Mona" } }
            },
            "Select": {
                method: "POST",
                path: "/select",
                body: { table: "users", where: "id=1", limit: 10, dedupeKey: "id" }
            },
            "Update": {
                method: "POST",
                path: "/update",
                body: { table: "users", set: { name: "Sara" }, where: "id=1" }
            },
            "Delete": {
                method: "POST",
                path: "/delete",
                body: { table: "users", where: "id=1" }
            },
            "Drop table": {
                method: "POST",
                path: "/table/drop",
                body: { table: "users" }
            },
            "Drop database": {
                method: "POST",
                path: "/db/drop",
                body: {}
            },
            "Special summary": {
                method: "POST",
                path: "/special/summary",
                body: { table: "users" }
            },
            "Health": {
                method: "GET",
                path: "/health",
                body: null
            }
        };

        const operationSelect = document.getElementById("operation");
        const methodInput = document.getElementById("method");
        const pathInput = document.getElementById("path");
        const bodyInput = document.getElementById("body");
        const responseBox = document.getElementById("response");
        const masterUrlInput = document.getElementById("masterUrl");

        Object.keys(templates).forEach((name) => {
            const option = document.createElement("option");
            option.value = name;
            option.textContent = name;
            operationSelect.appendChild(option);
        });

        function loadTemplate() {
            const selected = templates[operationSelect.value];
            methodInput.value = selected.method;
            pathInput.value = selected.path;
            bodyInput.value = selected.body ? JSON.stringify(selected.body, null, 2) : "";
        }

        async function sendRequest() {
            responseBox.textContent = "Sending...";
            const payload = {
                path: pathInput.value.trim(),
                method: methodInput.value.trim() || "POST"
            };

            const bodyText = bodyInput.value.trim();
            if (bodyText) {
                try {
                    payload.body = JSON.parse(bodyText);
                } catch (err) {
                    responseBox.textContent = "Invalid JSON body";
                    return;
                }
            } else {
                payload.body = null;
            }

            try {
                const res = await fetch("/api/forward", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });
                const text = await res.text();
                responseBox.textContent = `Status ${res.status}\n${text}`;
            } catch (err) {
                responseBox.textContent = String(err);
            }
        }

        document.getElementById("load").addEventListener("click", loadTemplate);
        document.getElementById("send").addEventListener("click", sendRequest);

        fetch("/api/config")
            .then((res) => res.json())
            .then((data) => {
                masterUrlInput.value = data.master || "";
            })
            .catch(() => {
                masterUrlInput.value = "";
            });

        loadTemplate();
    </script>
</body>

</html>
